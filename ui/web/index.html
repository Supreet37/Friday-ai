<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday — AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --cyan:        #00f5ff;
            --cyan-dim:    rgba(0,245,255,0.12);
            --cyan-glow:   rgba(0,245,255,0.4);
            --violet:      #b44dff;
            --violet-dim:  rgba(180,77,255,0.12);
            --violet-glow: rgba(180,77,255,0.45);
            --pink:        #ff2d78;
            --pink-dim:    rgba(255,45,120,0.12);
            --pink-glow:   rgba(255,45,120,0.4);
            --amber:       #ffb800;
            --green:       #00ff8c;
            --bg:          #03030a;
            --panel:       rgba(5,8,22,0.94);
            --surface:     rgba(255,255,255,0.03);
            --border:      rgba(0,245,255,0.14);
            --border2:     rgba(180,77,255,0.16);
            --text:        #ddefff;
            --muted:       rgba(160,200,230,0.45);
            --red:         #ff2d78;
            --blue:        #00f5ff;
            --font-hud:    'Orbitron', sans-serif;
            --font-mono:   'Share Tech Mono', monospace;
            --font-body:   'Exo 2', sans-serif;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            height: 100vh; overflow: hidden;
            color: var(--text);
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        .orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(90px);
            animation: orbFloat 14s ease-in-out infinite alternate;
        }
        .orb-1 { width:500px; height:500px; top:-150px; left:-100px; background:rgba(0,245,255,0.06); }
        .orb-2 { width:380px; height:380px; bottom:-100px; right:25%; background:rgba(180,77,255,0.07); animation-delay:-5s; }
        .orb-3 { width:300px; height:300px; top:20%; right:-80px; background:rgba(255,45,120,0.05); animation-delay:-10s; }
        @keyframes orbFloat { from{transform:translateY(0) scale(1)} to{transform:translateY(-35px) scale(1.06)} }

        /* ── ROOT LAYOUT ── */
        .layout {
            position: relative; z-index: 1;
            display: grid;
            grid-template-columns: 220px 1fr 380px;
            height: 100vh;
        }

        /* ══════════ LEFT COLUMN ══════════ */
        .left-col {
            display: flex; flex-direction: column;
            gap: 16px; padding: 20px 14px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            position: relative; overflow: hidden;
        }
        .left-col::before {
            content: ''; position: absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0.5;
        }

        /* shared box */
        .side-box {
            flex: 1; border: 1px solid var(--border); border-radius: 14px;
            background: rgba(0,245,255,0.025);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            padding: 20px 12px; gap: 12px;
        }
        .side-box::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(0,245,255,0.06) 0%, transparent 70%);
            pointer-events: none;
        }
        .box-label {
            font-family: var(--font-hud); font-size: 9px; font-weight: 600;
            letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            white-space: nowrap;
        }
        .side-box .c-tl, .side-box .c-br {
            position: absolute; width: 14px; height: 14px; pointer-events: none;
        }
        .side-box .c-tl { top:8px; left:8px; border-top:1.5px solid var(--cyan); border-left:1.5px solid var(--cyan); opacity:0.6; }
        .side-box .c-br { bottom:8px; right:8px; border-bottom:1.5px solid var(--cyan); border-right:1.5px solid var(--cyan); opacity:0.6; }

        /* WAKE BOX */
        .mic-box { border-color: rgba(0,245,255,0.2); background: rgba(0,245,255,0.015); }
        .mic-box::after { background: radial-gradient(circle at 50% 0%, rgba(0,245,255,0.07) 0%, transparent 70%); }
        .mic-box .box-label { color: rgba(0,245,255,0.45); }
        .mic-box .c-tl, .mic-box .c-br { border-color: var(--cyan) !important; opacity:0.5; }

        /* always-on sonar rings */
        .sonar-outer {
            width: 110px; height: 110px; border-radius: 50%;
            border: 1px solid rgba(0,245,255,0.15);
            display:flex; align-items:center; justify-content:center;
            animation: sonarPing 2.4s ease-in-out infinite;
        }
        @keyframes sonarPing {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,245,255,0.2); }
            50%      { box-shadow: 0 0 0 16px rgba(0,245,255,0); }
        }
        .sonar-inner {
            width: 86px; height: 86px; border-radius: 50%;
            border: 1px solid rgba(0,245,255,0.3);
            display:flex; align-items:center; justify-content:center;
            background: rgba(0,245,255,0.03);
        }
        .sonar-core {
            width: 62px; height: 62px; border-radius: 50%;
            background: linear-gradient(145deg, rgba(0,245,255,0.15), rgba(0,245,255,0.04));
            border: 1.5px solid rgba(0,245,255,0.5);
            color: var(--cyan); font-size: 22px;
            display:flex; align-items:center; justify-content:center;
        }
        /* override colours when status changes */
        .sonar-outer.listening { border-color: rgba(255,45,120,0.3); animation: sonarPingPink 0.8s ease-in-out infinite; }
        @keyframes sonarPingPink {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,45,120,0.4); }
            50%      { box-shadow: 0 0 0 20px rgba(255,45,120,0); }
        }
        .sonar-outer.listening .sonar-inner { border-color: rgba(255,45,120,0.6); }
        .sonar-outer.listening .sonar-core  { background: rgba(255,45,120,0.2); border-color: var(--pink); color: var(--pink); }

        .mic-label {
            font-family: var(--font-hud); font-size: 9px; letter-spacing: 2.5px;
            color: var(--muted); text-align:center;
        }

        /* LANG BOX */
        .lang-box { border-color: var(--border2); background: rgba(180,77,255,0.02); }
        .lang-box::after { background: radial-gradient(circle at 50% 100%, rgba(180,77,255,0.08) 0%, transparent 70%); }
        .lang-box .box-label { color: rgba(180,77,255,0.55); }
        .lang-box .c-tl, .lang-box .c-br { border-color: var(--violet) !important; opacity:0.5; }

        .lang-display {
            font-family: var(--font-hud); font-size: 28px; font-weight: 700;
            color: var(--violet); letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(180,77,255,0.5);
        }
        .lang-sub { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; }

        .lang-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; width: 100%; margin-top: 4px;
        }
        .lang-btn {
            padding: 10px 6px; border-radius: 8px; cursor: pointer;
            border: 1px solid var(--border2);
            background: rgba(180,77,255,0.06);
            color: rgba(180,77,255,0.6);
            font-family: var(--font-hud); font-size: 9px; letter-spacing: 1.5px;
            text-align: center; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .lang-btn:hover { background: rgba(180,77,255,0.16); border-color: rgba(180,77,255,0.5); color: var(--violet); }
        .lang-btn.active {
            background: rgba(180,77,255,0.22); border-color: rgba(180,77,255,0.7);
            color: var(--violet); box-shadow: 0 0 12px rgba(180,77,255,0.25);
        }
        .lang-btn .flag { font-size: 18px; }
        .lang-btn .code { font-size: 9px; letter-spacing: 2px; }

        /* ══════════ CENTER COLUMN ══════════ */
        .center-col {
            display: flex; flex-direction: column;
            align-items: center;
            background: rgba(3,5,14,0.97);
            border-right: 1px solid var(--border);
            overflow: hidden; position: relative;
        }

        .id-strip {
            width: 100%; padding: 14px 24px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
        }
        .id-left { display:flex; align-items:center; gap:10px; }
        .id-dot { width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:blink 2s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
        .id-name { font-family:var(--font-hud); font-size:14px; font-weight:700; color:var(--cyan); letter-spacing:3px; }
        .id-name em { font-style:normal; color:var(--muted); font-weight:400; font-size:11px; margin-left:4px; }

        /* id-status: exact same ID as original script.js uses */
        .id-status {
            padding: 3px 12px; border-radius: 20px;
            font-family: var(--font-hud); font-size: 10px; letter-spacing: 2px;
            background: var(--cyan-dim); border: 1px solid rgba(0,245,255,0.25);
            color: var(--cyan); transition: all 0.3s;
        }
        .id-status.listening { background: rgba(255,45,120,0.15); border-color: rgba(255,45,120,0.3); color: var(--pink); }
        .id-status.thinking  { background: rgba(255,184,0,0.1);   border-color: rgba(255,184,0,0.25);  color: var(--amber); }
        .id-status.speaking  { background: rgba(0,255,140,0.1);   border-color: rgba(0,255,140,0.25);  color: var(--green); }

        .avatar-stage {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; width: 100%;
        }

        .ring {
            position: absolute; border-radius: 50%; border: 1px solid;
            pointer-events: none; top:50%; left:50%;
            transform: translate(-50%, -50%);
        }
        .ring-1 { width:380px; height:380px; border-color:rgba(0,245,255,0.08); animation:spinR 20s linear infinite; border-style:dashed; }
        .ring-2 { width:320px; height:320px; border-color:rgba(0,245,255,0.13); animation:spinR 13s linear infinite reverse; }
        .ring-3 { width:280px; height:280px; border-color:rgba(180,77,255,0.1); animation:spinR 25s linear infinite; border-style:dashed; }
        .ring-4 { width:240px; height:240px; border-color:rgba(255,45,120,0.06); animation:spinR 16s linear infinite reverse; }
        @keyframes spinR { to { transform: translate(-50%,-50%) rotate(360deg); } }

        .scan-sweep {
            position: absolute; width:300px; height:300px; border-radius:50%;
            top:50%; left:50%; transform:translate(-50%,-50%);
            background: conic-gradient(from 0deg, transparent 330deg, rgba(0,245,255,0.12) 355deg, rgba(0,245,255,0.02) 360deg);
            animation: scanSpin 3.5s linear infinite; pointer-events:none;
        }
        @keyframes scanSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }

        .brk { position:absolute; width:26px; height:26px; pointer-events:none; }
        .brk.tl { top:calc(50% - 148px); left:calc(50% - 158px); border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); opacity:0.7; }
        .brk.tr { top:calc(50% - 148px); left:calc(50% + 132px); border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); opacity:0.7; }
        .brk.bl { top:calc(50% + 122px); left:calc(50% - 158px); border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); opacity:0.7; }
        .brk.br { top:calc(50% + 122px); left:calc(50% + 132px); border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); opacity:0.7; }

        .avatar-frame {
            position: relative; z-index: 2;
            width: 100%; height: 100%; border-radius: 0%; overflow: hidden;
            border: 2.5px solid rgba(0,245,255,0.55);
            box-shadow: 0 0 0 8px rgba(0,245,255,0.06), 0 0 60px rgba(0,245,255,0.3), 0 0 120px rgba(0,245,255,0.1);
            background: #03050e;
        }
        .avatar-img {
            position: absolute; inset: 0; width:100%; height:100%;
            object-fit: contain; object-position: center top; z-index:1;
        }
        .avatar-fallback {
            display: none; position: absolute; inset: 0; z-index:1;
            flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #060d1e 0%, #0c1730 100%);
            color: var(--cyan); font-family: var(--font-hud);
            font-size: 11px; letter-spacing: 3px; gap: 10px;
        }
        .avatar-fallback i { font-size: 64px; opacity: 0.6; }

        /* status-gif and listen-pulse — same class names as script.js expects */
        .status-gif {
            position: absolute; inset:0; width:100%; height:100%;
            object-fit: cover; z-index:2;
        }
        .listen-pulse {
            position: absolute; inset:0; border-radius:50%;
            pointer-events: none; opacity:0; z-index:3; transition: opacity 0.3s;
        }
        .listen-pulse.active { opacity:1; animation: listenPulse 1.1s ease-out infinite; }
        @keyframes listenPulse {
            0%  { box-shadow: 0 0 0 0   rgba(255,45,120,0.7); }
            70% { box-shadow: 0 0 0 28px rgba(255,45,120,0); }
            100%{ box-shadow: 0 0 0 0   rgba(255,45,120,0); }
        }

        .hud-bar {
            width:100%; padding:14px 28px; flex-shrink:0;
            border-top: 1px solid var(--border);
            display: flex; align-items:center; justify-content:center; gap:0;
            background: rgba(0,0,0,0.35);
        }
        .hud-cell { flex:1; text-align:center; font-family: var(--font-hud); }
        .hud-val  { font-size:13px; font-weight:700; color:var(--cyan); letter-spacing:2px; transition: color 0.3s; }
        .hud-key  { font-size:8px; color:var(--muted); letter-spacing:2px; margin-top:3px; }
        .hud-sep  { width:1px; height:28px; background:var(--border); }

        .data-strip {
            padding: 8px 24px; width:100%; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; gap:8px;
            font-family: var(--font-mono); font-size:10px; color: var(--muted);
            background: rgba(0,0,0,0.5);
            border-top: 1px solid rgba(0,245,255,0.06);
        }
        .ds-dot { width:3px; height:3px; border-radius:50%; background:var(--muted); }

        /* ══════════ RIGHT COLUMN ══════════ */
        .right-col {
            display: flex; flex-direction: column;
            background: rgba(4,6,18,0.96);
            position: relative; overflow: hidden;
        }
        .right-col::before {
            content: ''; position: absolute; top:0; left:0; right:0; height:1px;
            background: linear-gradient(90deg, transparent, var(--violet), transparent);
            opacity: 0.5;
        }

        .chat-header {
            padding: 16px 20px; flex-shrink:0;
            border-bottom: 1px solid var(--border);
            display: flex; align-items:center; justify-content:space-between;
            background: rgba(0,0,0,0.3);
        }
        .ch-left { display:flex; align-items:center; gap:12px; }
        .ch-icon {
            width:36px; height:36px; border-radius:10px;
            background: var(--violet-dim); border: 1px solid var(--border2);
            display:flex; align-items:center; justify-content:center;
            color: var(--violet); font-size:15px;
        }
        .ch-title { font-family:var(--font-hud); font-size:12px; font-weight:600; letter-spacing:2.5px; color:var(--violet); }
        .ch-sub   { font-size:10px; color:var(--muted); margin-top:2px; letter-spacing:1px; }
        .ch-actions { display:flex; gap:8px; }
        .icon-btn {
            width:34px; height:34px; border-radius:8px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--muted); font-size:13px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition: all 0.2s;
        }
        .icon-btn:hover { color:var(--pink); border-color:rgba(255,45,120,0.4); }

        .chat-messages {
            flex:1; overflow-y:auto; padding:20px 16px;
            display:flex; flex-direction:column; gap:14px;
        }
        .chat-messages::-webkit-scrollbar { width:3px; }
        .chat-messages::-webkit-scrollbar-track { background:transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background:rgba(180,77,255,0.25); border-radius:4px; }

        .message {
            display:flex; gap:9px; max-width:88%;
            animation: msgIn 0.3s ease-out;
        }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .message.user      { align-self:flex-end; flex-direction:row-reverse; }
        .message.assistant { align-self:flex-start; }

        .msg-avatar {
            width:30px; height:30px; border-radius:50%; flex-shrink:0;
            display:flex; align-items:center; justify-content:center; font-size:12px;
            margin-top:2px;
        }
        .message.assistant .msg-avatar { background:var(--violet-dim); border:1px solid var(--border2); color:var(--violet); }
        .message.user      .msg-avatar { background:var(--pink-dim);   border:1px solid rgba(255,45,120,0.3); color:var(--pink); }

        .msg-body { display:flex; flex-direction:column; gap:4px; }
        .bubble {
            padding:10px 14px; border-radius:14px;
            font-size:13.5px; line-height:1.6;
            word-break:break-word; color:var(--text);
        }
        .message.assistant .bubble {
            background: rgba(180,77,255,0.07);
            border: 1px solid rgba(180,77,255,0.16);
            border-radius: 4px 14px 14px 14px;
        }
        .message.user .bubble {
            background: rgba(255,45,120,0.1);
            border: 1px solid rgba(255,45,120,0.22);
            border-radius: 14px 4px 14px 14px;
            text-align:right;
        }
        .time { font-size:9.5px; color:var(--muted); padding:0 3px; }
        .message.user .time { text-align:right; }

        .typing .bubble { display:flex; gap:5px; align-items:center; padding:14px 18px; }
        .typing-dot {
            width:6px; height:6px; border-radius:50%;
            background:var(--violet); opacity:0.7;
            animation: typingB 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay:0.2s; }
        .typing-dot:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingB { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }

        .chat-input-area {
            padding:14px 16px; flex-shrink:0;
            border-top: 1px solid var(--border);
            display:flex; gap:10px; align-items:center;
            background: rgba(0,0,0,0.3);
        }
        .input-wrapper { flex:1; }
        .chat-input {
            width:100%; padding:11px 16px;
            background: rgba(180,77,255,0.05);
            border: 1px solid var(--border2);
            border-radius:10px;
            color:var(--text); font-size:13.5px;
            font-family: var(--font-body); outline:none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .chat-input::placeholder { color:var(--muted); }
        .chat-input:focus {
            border-color: rgba(180,77,255,0.5);
            box-shadow: 0 0 0 3px rgba(180,77,255,0.08);
        }
        .send-btn {
            width:42px; height:42px; border-radius:10px;
            background: linear-gradient(145deg, rgba(180,77,255,0.22), rgba(180,77,255,0.08));
            border: 1px solid rgba(180,77,255,0.5);
            color:var(--violet); font-size:15px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:all 0.2s;
        }
        .send-btn:hover { background:rgba(180,77,255,0.3); box-shadow:0 0 18px rgba(180,77,255,0.35); transform:translateY(-1px); }
        .send-btn:active { transform:translateY(0) scale(0.96); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="layout">

        <!-- ═══ LEFT COLUMN ═══ -->
        <div class="left-col">

            <!-- VOICE BOX — always-on, no button needed -->
            <div class="side-box mic-box" id="voiceBox">
                <div class="c-tl"></div><div class="c-br"></div>
                <span class="box-label">VOICE &middot; ALWAYS ON</span>

                <div class="sonar-outer" id="sonarOuter">
                    <div class="sonar-inner">
                        <div class="sonar-core" id="sonarCore">
                            <i class="fas fa-microphone"></i>
                        </div>
                    </div>
                </div>

                <span class="mic-label" id="wakeLabel">SAY "HEY FRIDAY"</span>
            </div>

            <!-- LANGUAGE BOX (bottom half) -->
            <div class="side-box lang-box">
                <div class="c-tl"></div><div class="c-br"></div>
                <span class="box-label">LANGUAGE</span>

                <div class="lang-display" id="langDisplay">EN</div>
                <div class="lang-sub" id="langSubLabel">ENGLISH</div>

                <div class="lang-grid">
                    <button class="lang-btn active" data-lang="en" data-name="ENGLISH">
                        <span class="flag">🇺🇸</span>
                        <span class="code">EN</span>
                    </button>
                    <button class="lang-btn" data-lang="hi" data-name="HINDI">
                        <span class="flag">🇮🇳</span>
                        <span class="code">HI</span>
                    </button>
                    <button class="lang-btn" data-lang="fr" data-name="FRENCH">
                        <span class="flag">🇫🇷</span>
                        <span class="code">FR</span>
                    </button>
                    <button class="lang-btn" data-lang="ja" data-name="JAPANESE">
                        <span class="flag">🇯🇵</span>
                        <span class="code">JP</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ═══ CENTER COLUMN ═══ -->
        <div class="center-col">

            <div class="id-strip">
                <div class="id-left">
                    <div class="id-dot"></div>
                    <span class="id-name">FRIDAY <em>v2.0</em></span>
                </div>
                <!-- id="statusLabel" — exact ID script.js writes to -->
                <div class="id-status" id="statusLabel">IDLE</div>
            </div>

            <div class="avatar-stage">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="ring ring-4"></div>
                <div class="scan-sweep"></div>
                <div class="brk tl"></div><div class="brk tr"></div>
                <div class="brk bl"></div><div class="brk br"></div>

                <div class="avatar-frame">
                    <img src="/assets/avatar.png" alt="Friday" class="avatar-img" id="avatar"
                        onload="console.log('Avatar loaded!')"
                        onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';">
                    <div class="avatar-fallback" id="avatar-fallback">
                        <i class="fas fa-robot"></i>
                        <span>FRIDAY</span>
                    </div>
                    <!-- id="listeningGif/speakingGif/thinkingGif" — exact IDs script.js controls -->
                    <img src="/assets/listening.gif" alt="" class="status-gif" id="listeningGif" style="display:none;">
                    <img src="/assets/speaking.gif"  alt="" class="status-gif" id="speakingGif"  style="display:none;">
                    <img src="/assets/thinking.gif"  alt="" class="status-gif" id="thinkingGif"  style="display:none;">
                    <!-- id="listenPulse" — exact ID script.js toggles .active on -->
                    <div class="listen-pulse" id="listenPulse"></div>
                </div>
            </div>

            <div class="hud-bar">
                <div class="hud-cell">
                    <!-- id="hudMode" — exact ID script.js writes to -->
                    <div class="hud-val" id="hudMode">STANDBY</div>
                    <div class="hud-key">MODE</div>
                </div>
                <div class="hud-sep"></div>
                <div class="hud-cell">
                    <!-- id="hudLang" — exact ID script.js writes to -->
                    <div class="hud-val" id="hudLang">EN</div>
                    <div class="hud-key">LANG</div>
                </div>
                <div class="hud-sep"></div>
                <div class="hud-cell">
                    <!-- id="hudConn" — exact ID script.js writes to -->
                    <div class="hud-val" id="hudConn">—</div>
                    <div class="hud-key">CONN</div>
                </div>
                <div class="hud-sep"></div>
                <div class="hud-cell">
                    <div class="hud-val" id="clockDisplay">--:--</div>
                    <div class="hud-key">TIME</div>
                </div>
            </div>

            <div class="data-strip">
                <span>SYS:ONLINE</span>
                <div class="ds-dot"></div>
                <span>NLP:READY</span>
                <div class="ds-dot"></div>
                <span>NEURAL:ACTIVE</span>
            </div>
        </div>

        <!-- ═══ RIGHT COLUMN ═══ -->
        <div class="right-col">
            <div class="chat-header">
                <div class="ch-left">
                    <div class="ch-icon"><i class="fas fa-comment-dots"></i></div>
                    <div>
                        <div class="ch-title">NEURAL LINK</div>
                        <div class="ch-sub">ENCRYPTED · LOCAL SESSION</div>
                    </div>
                </div>
                <div class="ch-actions">
                    <button class="icon-btn" id="clearBtn" title="Clear chat">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
            </div>

            <!-- id="chatMessages" — exact ID script.js appends messages to -->
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="msg-avatar"><i class="fas fa-robot"></i></div>
                    <div class="msg-body">
                        <div class="bubble">Hello, sir. I'm Friday — your personal AI assistant. How can I help you today?</div>
                        <div class="time">Just now</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <!-- id="chatInput" — exact ID script.js reads from -->
                    <input type="text" id="chatInput" placeholder="Send a message to Friday…" class="chat-input" autocomplete="off">
                </div>
                <!-- id="sendBtn" — exact ID script.js binds click to -->
                <button class="send-btn" id="sendBtn" aria-label="Send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- script.js first — it defines showStatus, sendMessage, etc. -->
    <script src="script.js"></script>

    <!-- inline logic AFTER script.js so all its globals exist -->
    <script>
        // Clock
        function updateClock() {
            document.getElementById('clockDisplay').textContent =
                new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Language selector — updates langDisplay, langSubLabel, and hudLang
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const code = btn.dataset.lang.toUpperCase();
                const name = btn.dataset.name;
                document.getElementById('langDisplay').textContent    = code;
                document.getElementById('langSubLabel').textContent   = name;
                document.getElementById('hudLang').textContent        = code;
            });
        });

        // Status label now handled by script.js via SSE events
    </script>
</body>
</html>
